<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
	<link rel="stylesheet" type="text/css" media="all" href="../css/global.css" th:href="@{/css/global.css}" />
	<title>Header</title>
</head>
<body>
	<div th:fragment="header" th:if="${session.user}">
		<div class="header-div header-frame">
			<div class="header-title">Hello </div>
			<div class="header-subtitle">
				User: <b><span th:text="${session.user.username}"></span></b><br>
				Personal code: <b><span th:text="${session.user.id_user}"></span></b>
			</div>
		</div>
		<div class="header-buttons header-frame">
			<span><a th:href="@{/}">Your home</a></span>
			<br>
			<span><a th:href="@{/Logout}">Log out</a></span>
		</div>
	</div>
</body>
