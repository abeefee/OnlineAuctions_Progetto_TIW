<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
	<link rel="stylesheet" type="text/css" href="../css/style.css" th:href="@{/css/style.css}">
	<link rel="stylesheet" type="text/css" href="../css/home.css" th:href="@{/css/home.css}">
	<title>Error page</title>
</head>
<body>
	<div th:replace="/WEB-INF/header :: header"> </div>
	
	<h1 class="title home-title">Error page!</h1>
	
	<div align="center">
		<div>An error occured</div>
		<div>
			Your error is: <b><span th:text="${error}">sample error</span></b>
		</div>
		<div th:if="${session.user == null}">
			<hr>
			<a th:href="@{/}">Press here to go back to the login page</a>
		</div>
		<div th:if="${session.user != null}">
			<hr>
			<a th:href="@{/Logout}">Press here to logout</a>
		</div>
	</div>
</body>
</html>
