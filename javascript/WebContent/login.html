<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link rel="stylesheet" type="text/css" href="css/style.css"/>
	<link rel="stylesheet" type="text/css" href="css/login.css"/>
	<script src="js/utils.js" charset="UTF-8" defer></script>
	<script src="js/loginManager.js" charset="UTF-8" defer></script>
</head>
<body>
	<h1 class="title login-title">Welcome to the auction website!</h1>
	<div class="frame login-div">
		<div class="subtitle">Insert your credentials to Login</div>
		<form action="#">
			<div class="form-part">
				<label for="username">Username: </label>
				<input type="text" id="username" name="username" required>
			</div>
			<div class="form-part">
				<label for="password">Password: </label>
				<input type="password" id="password" name="password" required>
			</div>
			<input class="btn login-btn" id="login-btn" type="button" value="Login">
		</form>
		<div  id="login_warning_div" class="warning-div"></div>
		<hr>
		<a id="open_register_button" href="#">Register now!</a>
	</div>
	<br><br><br><br>
	<div id="register-div" class="frame register-div">
		<div class="subtitle">Create a new Account</div>
		<form action="#">
			<div class="form-part">
				<label for="usernameReq">Username: </label>
				<input type="text" id="usernameReq" name="usernameReq" required>
			</div>
			<div class="form-part">
				<label for="passwordReq">Password: </label>
				<input type="password" id="passwordReq" name="passwordReq" required>
			</div>
			<div class="form-part">
				<label for="addressReq">Address: </label>
				<input type="text" id="addressReq" name="addressReq" required>
			</div>
			<input class="btn register-btn" id="register-btn" type="button" value="Register">
		</form>
		<div id="register_warning_div" class="warning-div"></div>
	</div>
</body>
</html>
